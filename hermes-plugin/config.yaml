# Hermes VIP — runtime configuration
# 修改后重启 Hermes Desktop 生效，MacOS container cli需要重建vm才能生效，注意容器里面没有写在挂载读写目录的数据会丢失。建议挂载一个宿主机的目录到容器根目录。

# ── 容器沙箱 ──
sandbox:
  enabled: true
  network: true

  # 容器 VM 规格
  container:
    name: hermes-vm
    image: hermes-vm:latest
    memory_mb: 2048
    cpus: 4

  # hermes-run 重试策略
  retry:
    intervals: [2, 60, 600]     # 秒级 → 分钟级 → 10分钟级
    restart_container: false    # false: 只重试不重启，保护并行任务

  # 卷挂载
  #   host_path:      Mac 宿主机路径
  #   container_path: 容器内路径
  #   容器内默认 PATH 已包含 /usr/local/bin
  mounts:

    # ── 只读 ──
    - host_path: $HOME/.hermes/config.yaml
      container_path: $HOME/.hermes/config.yaml
      writable: false

    - host_path: $HOME/.hermes/plugins/hermes-vip/config.yaml
      container_path: $HOME/.hermes/plugins/hermes-vip/config.yaml
      writable: false

    - host_path: $HOME/.hermes/profiles
      container_path: $HOME/.hermes/profiles
      writable: false


    # ── 读写 ──
    # workspace 独立挂载（docker 无法挂 /, 此挂载保证两端一致）
    - host_path: $HOME/hermes-workspace
      container_path: $HOME/hermes-workspace
      writable: true

    # 根文件系统持久化（Apple container 专用: hermes-vm-root 直挂 /）
    # docker 由 ctl.sh 自动跳过此挂载
    - host_path: $HOME/hermes-vm-root
      container_path: /
      writable: true

# ── 提权网关 ──
vip_sudo:
  enabled: true
