# VIP plugin configuration — sandbox mounts for container isolation.
# Changes take effect on next Hermes chat session.
# Paths support $HOME, ~ and environment variables.

sandbox:
  enabled: true
  network: true

  mounts:
    - path: $HOME/hermes-workspace
      writable: true
    - path: $HOME/.hermes/plugins/hermes-vip/config.yaml
      writable: false
    - path: $HOME/.hermes/config.yaml
      writable: false
    - path: $HOME/.hermes/profiles
      writable: false

vip_sudo:
  enabled: true
